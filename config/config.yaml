model:
  type: yolo26
  path: ../models/yolo26n/model.onnx
  input_size: 416
  confidence: 0.45
  iou: 0.50
  max_detections: 100
  output_layout: auto
  class_names: [kite]

inference:
  backend: onnx
  threads: 4
  input_name: images
  vulkan: false

source:
  type: webcam
  id: camera-0
  device: 0
  width: 1280
  height: 720
  fps: 30
  loop: false

pipeline:
  frame_queue_size: 2
  result_queue_size: 2
  drop_old_frames: true

tracking:
  enabled: true
  minimum_iou: 0.30
  max_lost_frames: 30

monitoring:
  enabled: true
  confirmation_frames: 3
  lost_frames: 10
  minimum_confidence: 0.50
  target_classes:
    - kite

output:
  window: true
  recorder: false
  mqtt: false

logging:
  level: info
